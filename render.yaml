# Render Blueprint — deploys Steward as a single web service serving both the /api
# routes and the built frontend, plus a Postgres database for durable state.
# Import this repo at https://dashboard.render.com/blueprints.

databases:
  - name: steward-db
    databaseName: steward
    plan: free

services:
  - type: web
    name: steward
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: steward-db
          property: connectionString

      # ── SnapTrade (read-only brokerage connection) ─────────────────────────
      # sync:false keeps secrets out of git — paste them into Render's Environment tab.
      - key: SNAPTRADE_CLIENT_ID
        sync: false
      - key: SNAPTRADE_CONSUMER_KEY
        sync: false

      # ── Email (verification + password reset via Resend) ───────────────────
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: APP_URL
        sync: false

      # Render terminates TLS and sets X-Forwarded-For; trust it for rate-limiting.
      - key: TRUST_PROXY
        value: "1"
